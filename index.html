<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBeats Hub — Global Streaming & Creator Studio</title>
    
    <!-- 🔒 ERZWUNGENE HTTPS- & SSL/TLS-UMLEITUNG -->
    <script>
        if (location.protocol === 'http:') {
            location.replace(`https://${location.host}${location.pathname}${location.search}`);
        }
    </script>
    
    <style>
        :root {
            --bg: #030608;
            --surface: #0a0f12;
            --card: #10171d;
            --primary: #00bfa5;
            --primary-hover: #009688;
            --primary-glow: rgba(0, 191, 165, 0.3);
            --accent-quantum: #9d4edd;
            --accent-glow: rgba(157, 78, 221, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border: #1e293b;
            --lock: #ff3366;
            --unlock: #00e676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: var(--bg); 
            background-image: 
                radial-gradient(at 0% 0%, rgba(157, 78, 221, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 191, 165, 0.05) 0px, transparent 50%);
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding-bottom: 140px; 
            overflow-x: hidden; 
        }

        .container { max-width: 680px; width: 100%; margin: 0 auto; padding: 25px 20px; display: flex; flex-direction: column; gap: 24px; }
        
        /* HEADER ARCHITEKTUR */
        .header { text-align: center; padding: 40px 0 20px 0; position: relative; }
        .logo-glow {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            animation: floatAnimation 3s ease-in-out infinite alternate;
        }
        @keyframes floatAnimation { 
            from { transform: translateY(0px) rotate(0deg); } 
            to { transform: translateY(-8px) rotate(3deg); } 
        }
        h1 { font-size: 2.4rem; font-weight: 800; background: linear-gradient(135deg, #fff 30%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 8px; font-weight: 400; letter-spacing: 0.3px; }

        /* BENUTZER INTERFACE LEISTE (PROFIL-HUD) */
        #user-profile-bar { 
            margin-top: 20px; 
            display: none; 
            background: rgba(0, 191, 165, 0.05); 
            border: 1px solid rgba(0, 191, 165, 0.15); 
            padding: 14px 20px; 
            border-radius: 30px; 
            font-size: 0.85rem; 
            color: var(--primary); 
            align-items: center;
            justify-content: space-between;
        }
        .user-meta-wrapper { display: flex; align-items: center; gap: 8px; }

        /* CORE KARTEN-STRUKTUR */
        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 28px; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.6); 
            position: relative; 
            overflow: hidden; 
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent-quantum)); }
        
        h3 { margin-bottom: 20px; font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        h3 span.icon { color: var(--primary); }

        .compliance-box { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; }
        .compliance-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 191, 165, 0.05); border: 1px solid rgba(0, 191, 165, 0.15); color: var(--primary); padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.8px; }
        
        /* SCHLOSS BADGES */
        .lock-badge { background: rgba(255, 51, 102, 0.08); border: 1px solid var(--lock); color: var(--lock); padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .unlock-badge { background: rgba(0, 230, 118, 0.08); border: 1px solid var(--unlock); color: var(--unlock); padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 0 10px rgba(0, 230, 118, 0.2); }

        /* FORMULARE */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .form-group label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
        input { 
            width: 100%; 
            padding: 16px; 
            background: #060a0d; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            color: #fff; 
            font-size: 0.95rem; 
            transition: all 0.2s ease; 
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 191, 165, 0.1); outline: none; }

        /* UPLOAD CONTAINER */
        .upload-area { 
            background: #05080b; 
            border: 2px dashed var(--border); 
            padding: 40px 20px; 
            border-radius: 16px; 
            text-align: center; 
            cursor: pointer; 
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(0, 191, 165, 0.02); }
        .upload-area .up-icon { font-size: 2.2rem; display: block; margin-bottom: 12px; filter: drop-shadow(0 0 8px var(--primary-glow)); }
        .upload-area h4 { font-size: 1.05rem; margin-bottom: 4px; color: #fff; }
        .upload-area p { color: var(--text-muted); font-size: 0.8rem; }
        .upload-progress { margin-top: 20px; font-size: 0.9rem; color: var(--primary); display: none; font-weight: 600; text-align: center; }

        /* TRACKLIST DESIGN */
        .track-item { 
            background: var(--card); 
            border: 1px solid var(--border); 
            padding: 16px 20px; 
            border-radius: 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .track-item:hover { border-color: var(--primary); background: #16222b; transform: translateX(2px); }
        .track-meta-box { display: flex; align-items: center; gap: 14px; }
        .track-disc { width: 36px; height: 36px; background: #05080b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; border: 1px solid var(--border); }
        .track-title { font-weight: 600; font-size: 0.95rem; color: #fff; }
        .track-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* CONTROLS MASTER PLAYER BAR (FIXED) */
        .player-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(10, 15, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); 
            padding: 20px 40px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            box-shadow: 0 -15px 40px rgba(0,0,0,0.7); 
            z-index: 1000; 
            height: 130px; 
        }
        .player-info { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .p-meta-title { color: #fff; font-size: 1rem; font-weight: 700; display: block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-meta-status { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .progress-container { width: 100%; height: 6px; background: #05070a; border-radius: 10px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent-quantum)); border-radius: 10px; box-shadow: 0 0 10px var(--primary); }

        /* BUTTON DESIGN SCHIENEN */
        .btn { padding: 16px 28px; border: none; font-weight: 700; border-radius: 12px; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.8px; transition: all 0.22s ease; width: 100%; text-align: center; }
        .btn-primary { background: var(--primary); color: #030608; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 0 16px var(--primary-glow); }
        .btn-secondary { background: #060a0d; border: 1px solid var(--border); color: var(--text-main); margin-top: 12px; }
        .btn-secondary:hover { border-color: var(--text-muted); background: #0c1318; }
        
        .btn-logout { background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; font-size: 0.75rem; border-radius: 20px; font-weight: 700; cursor: pointer; width: auto; }
        .btn-logout:hover { border-color: var(--lock); color: var(--lock); background: rgba(255,51,102,0.03); }
        .btn-delete { background: transparent; border: 1px solid rgba(255, 51, 102, 0.15); color: var(--lock); padding: 8px 16px; font-size: 0.75rem; border-radius: 20px; font-weight: 700; cursor: pointer; margin-left: 8px; width: auto; }
