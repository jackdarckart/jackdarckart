<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Der Livestream von jackdarckart.">
  <title>jackdarckart · Livestream</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#1a1a1e;--accent:#00ffcc;--violet:#b553e6;--muted:#b5b5bd}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.5rem;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#24242e,var(--bg) 62%)}main{width:min(100%,42rem);padding:clamp(1.5rem,5vw,3rem);border:1px solid rgb(181 83 230/.45);border-radius:1rem;background:rgb(26 26 30/.78);box-shadow:0 0 3rem rgb(181 83 230/.18);text-align:center}.status{display:inline-flex;align-items:center;gap:.5rem;margin:0 0 1.5rem;color:var(--accent);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);box-shadow:0 0 1rem var(--accent)}h1{margin:0;font-size:clamp(2rem,7vw,3.5rem);letter-spacing:.04em;background:linear-gradient(100deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}.intro{color:var(--muted);line-height:1.6}.player{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;margin:2rem 0;padding:1rem;text-align:left;border:1px solid rgb(0 255 204/.38);border-radius:.8rem;background:linear-gradient(135deg,rgb(0 255 204/.08),rgb(181 83 230/.12))}button,.button{min-height:3rem;border-radius:.5rem;font:inherit;font-weight:700;cursor:pointer}#playButton{width:3rem;border:2px solid var(--accent);background:transparent;color:var(--accent)}#playButton:hover,#playButton:focus-visible{background:var(--accent);color:var(--bg)}.station{display:block;color:var(--accent);font-size:.78rem;letter-spacing:.08em}.button{display:block;width:100%;padding:.85rem 1rem;border:2px solid var(--accent);color:var(--accent);text-decoration:none;text-transform:uppercase;letter-spacing:.08em}.button:hover,.button:focus-visible{background:var(--accent);color:var(--bg)}#statusMessage{min-height:1.5em;margin:.75rem 0 0;color:var(--muted);font-size:.9rem}:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:25rem){.player{grid-template-columns:1fr;text-align:center}#playButton{margin:auto}}
  </style>
</head>
<body>
  <main>
    <p class="status"><span class="dot" aria-hidden="true"></span>Livestream</p>
    <h1>jackdarckart</h1>
    <p class="intro">Höre den Webradio-Livestream oder öffne den Mitgliederbereich.</p>
    <section class="player" aria-label="Audioplayer">
      <button id="playButton" type="button" aria-label="Livestream abspielen" aria-pressed="false">▶</button>
      <div><strong>jackdarckart</strong><span class="station">LIVE · WEBRADIO</span></div>
      <audio id="audio" preload="none"><source src="https://stream.laut.fm/jackdarckart" type="audio/mpeg"></audio>
    </section>
    <p id="statusMessage" role="status" aria-live="polite"></p>
    <a class="button" href="login.html">Mitgliederbereich öffnen</a>
  </main>
  <script>
    const audio=document.querySelector('#audio');const button=document.querySelector('#playButton');const status=document.querySelector('#statusMessage');
    const setState=(playing)=>{button.textContent=playing?'❚❚':'▶';button.setAttribute('aria-pressed',String(playing));button.setAttribute('aria-label',playing?'Livestream pausieren':'Livestream abspielen')};
    button.addEventListener('click',async()=>{try{if(audio.paused)await audio.play();else audio.pause();status.textContent=''}catch{status.textContent='Der Stream konnte nicht gestartet werden. Bitte versuche es später erneut.'}});
    audio.addEventListener('play',()=>setState(true));audio.addEventListener('pause',()=>setState(false));audio.addEventListener('error',()=>{setState(false);status.textContent='Der Stream ist derzeit nicht verfügbar.'});
  </script>
</body>
</html>
