<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jackdarckart | CloudBeats Nexus</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com https://stream.laut.fm 'unsafe-inline' 'unsafe-eval';">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.85) 0%, rgba(10, 15, 28, 0.95) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.6);
        }
        .cyber-button {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cyber-button:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-[#05070c] text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="w-full border-b border-purple-500/15 backdrop-blur-xl sticky top-0 z-50 bg-[#05070c]/90 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-500 p-0.5 shadow-lg shadow-purple-500/20">
                    <div class="w-full h-full bg-[#080c14] rounded-[10px] flex items-center justify-center text-base">🎛️</div>
                </div>
                <span class="font-black text-sm tracking-wider bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">jackdarckart</span>
            </div>
            
            <nav id="navbar-container" class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 justify-start sm:justify-end">
                <!-- Dynamisch geladen -->
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6 w-full my-auto text-center">
        <div id="views-container">
            <!-- Startseite -->
            <section id="view-home" class="view-section space-y-6 text-left">
                <div class="glass-panel p-8 sm:p-10 rounded-[2.5rem] text-center relative overflow-hidden">
                    <span class="inline-block text-4xl p-4 bg-purple-600/10 rounded-2xl mb-4 border border-purple-500/20 shadow-inner">⚡</span>
                    <h1 class="text-3xl sm:text-5xl font-black tracking-tight mb-3 bg-gradient-to-r from-white via-purple-200 to-cyan-300 bg-clip-text text-transparent">CloudBeats Nexus</h1>
                    <p class="text-cyan-400 text-xs sm:text-sm font-mono tracking-widest uppercase mb-6">Zentrales Steuerungs-Hub • GitHub Pages</p>
                    <p class="text-slate-300 text-xs sm:text-sm leading-relaxed max-w-xl mx-auto font-light mb-8">
                        Wähle eine Sektion aus oder nutze die Navigation oben. Alle Verknüpfungen und Module arbeiten vollständig bereinigt und ressourcensparend.
                    </p>
                    <div id="home-buttons-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-2xl mx-auto">
                        <!-- Dynamisch geladen -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-purple-500/15 py-3 px-4 bg-[#05070c] text-center">
        <div class="max-w-4xl mx-auto flex justify-between items-center text-[11px] font-mono text-slate-400">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Bereinigt &amp; Aktiv</span>
            <span class="text-purple-400/60">jackdarckart • CloudBeats</span>
        </div>
    </footer>

    <!-- SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sitePages = [
                { id: 'home', name: 'Home', icon: '🏠', desc: 'Zentrale Steuerungsübersicht' },
                { id: 'studio', name: 'Studio', icon: '🎸', desc: 'Audio-Produktion & Workspace' },
                { id: 'lyrics', name: 'Lyrics', icon: '📝', desc: 'Songwriting & Texteditor' },
                { id: 'crypto', name: 'Crypto', icon: '🪙', desc: 'Staking & Tokenomics Matrix' },
                { id: 'garden', name: 'Garden', icon: '🌱', desc: 'Landschaft & Webradio Stream' },
                { id: 'cloud', name: 'Cloud', icon: '☁️', desc: 'Backup & Datensicherung' },
                { id: 'admin', name: 'Admin', icon: '🛠️', desc: 'System-Telemetrie & Diagnose' }
            ];

            const navContainer = document.getElementById('navbar-container');
            const homeGrid = document.getElementById('home-buttons-grid');
            const viewsContainer = document.getElementById('views-container');

            sitePages.forEach(page => {
                if (page.id !== 'home') {
                    const section = document.createElement('section');
                    section.id = `view-${page.id}`;
                    section.className = 'view-section hidden space-y-4 text-left';
                    section.innerHTML = `
                        <div class="glass-panel p-6 sm:p-8 rounded-[2.5rem] space-y-4 border-purple-500/30">
                            <div class="flex items-center gap-3 border-b border-slate-800 pb-3">
                                <span class="text-3xl">${page.icon}</span>
                                <div>
                                    <h2 class="text-xl font-bold text-purple-300 font-mono">${page.name} Sektion</h2>
                                    <p class="text-xs text-slate-400">${page.desc}</p>
                                </div>
                            </div>
                            <p class="text-xs text-slate-300 font-mono">Bereich für ${page.name}.</p>
                            <button type="button" class="back-to-home cyber-button w-full sm:w-auto bg-slate-900 text-slate-300 px-5 py-2.5 rounded-xl text-xs font-mono border border-slate-800 cursor-pointer mt-4">← Zurück zur Startseite</button>
                        </div>
                    `;
                    viewsContainer.appendChild(section);
                }
            });

            sitePages.forEach(page => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cyber-button nav-link bg-slate-900/80 text-slate-300 hover:text-white px-3 py-2 rounded-xl text-xs font-medium border border-slate-800 cursor-pointer shrink-0';
                btn.dataset.target = page.id;
                btn.innerHTML = `${page.icon} ${page.name}`;
                navContainer.appendChild(btn);
            });

            sitePages.forEach(page => {
                if (page.id !== 'home') {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'cyber-button nav-link glass-panel p-4 rounded-2xl border border-purple-500/20 text-left hover:border-purple-500/50 cursor-pointer transition flex flex-col justify-between';
                    card.dataset.target = page.id;
                    card.innerHTML = `
                        <div class="text-2xl mb-2">${page.icon}</div>
                        <div class="text-xs font-bold text-white font-mono">${page.name}</div>
                        <div class="text-[10px] text-slate-400 mt-1">${page.desc}</div>
                    `;
                    homeGrid.appendChild(card);
                }
            });

            function switchView(targetId) {
                document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));
                const targetSec = document.getElementById(`view-${targetId}`);
                if (targetSec) {
                    targetSec.classList.remove('hidden');
                    localStorage.setItem('nexus_active_page', targetId);
                    window.scrollTo(0, 0);
                }
            }

            document.querySelectorAll('.nav-link').forEach(element => {
                element.addEventListener('click', () => {
                    const target = element.dataset.target;
                    switchView(target);
                });
            });

            document.querySelectorAll('.back-to-home').forEach(btn => {
                btn.addEventListener('click', () => switchView('home'));
            });

            const savedPage = localStorage.getItem('nexus_active_page') || 'home';
            switchView(savedPage);
        });
    </script>
</body>
</html>
