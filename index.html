<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jackdarckart | Webradio Startseite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010309; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glass-panel { background: linear-gradient(135deg, rgba(13, 22, 42, 0.88) 0%, rgba(5, 10, 22, 0.96) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(56, 189, 248, 0.2); }
        .cyber-button:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); border-color: rgba(56, 189, 248, 0.8); }
        @keyframes pulse-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .live-dot { animation: pulse-live 2s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center border-b border-cyan-500/20 pb-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-pink-500 p-0.5 flex items-center justify-center font-bold">🎧</div>
            <div>
                <span class="font-black text-xs tracking-widest uppercase bg-gradient-to-r from-cyan-400 to-pink-400 bg-clip-text text-transparent block">jackdarckart Nexus</span>
                <a href="https://laut.fm/jackdarckart" target="_blank" class="text-[10px] font-mono text-slate-400 hover:text-cyan-400">laut.fm/jackdarckart ↗</a>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="index.html" class="cyber-button bg-cyan-600/20 text-cyan-300 border border-cyan-500/40 px-3 py-2 rounded-xl text-xs font-mono font-bold">🎧 Webradio</a>
            <a href="login.html" id="nav-login-btn" class="cyber-button bg-slate-900 text-slate-300 hover:text-white border border-slate-800 px-3 py-2 rounded-xl text-xs font-mono font-bold">🔑 Login / Spiel</a>
        </div>
    </header>

    <!-- Main Player -->
    <main class="max-w-xl mx-auto w-full space-y-6 my-auto">
        <div class="glass-panel p-6 sm:p-8 rounded-[2.5rem] space-y-6 text-center">
            <div class="space-y-1">
                <span class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest font-bold">▶ Sendung Läuft Live</span>
                <h1 id="track-title" class="text-base sm:text-xl font-black text-white font-mono truncate">Verbindung wird aufgebaut...</h1>
            </div>

            <div class="flex items-center justify-center gap-2 bg-[#030712] py-2 px-4 rounded-xl border border-cyan-500/20 w-max mx-auto">
                <span class="w-2 h-2 rounded-full bg-red-500 live-dot"></span>
                <span class="text-[11px] font-mono text-cyan-400 uppercase font-bold">Hörer: <span id="listener-count">--</span></span>
            </div>

            <button type="button" id="play-btn" class="cyber-button w-full bg-gradient-to-r from-cyan-600 to-pink-500 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-widest cursor-pointer shadow-lg">
                <span id="play-icon">▶</span> <span id="play-text">Webradio Abspielen</span>
            </button>

            <div class="flex items-center justify-between bg-[#030712] px-4 py-2.5 rounded-xl border border-slate-800 text-xs font-mono">
                <span class="text-slate-400">Lautstärke</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" class="w-32 accent-cyan-500 cursor-pointer">
            </div>

            <audio id="audio-stream" preload="none">
                <source src="https://stream.laut.fm/jackdarckart" type="audio/mpeg">
            </audio>
        </div>

        <div class="glass-panel p-6 rounded-3xl space-y-3">
            <h2 class="text-xs font-mono text-cyan-300 uppercase font-bold">📜 Zuletzt gespielt</h2>
            <div id="last-songs-container" class="space-y-2 text-xs font-mono text-slate-300">Lade Historie...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-[10px] font-mono text-slate-500 border-t border-slate-900 pt-4">
        © 2026 jackdarckart • Webradio Hub
    </footer>

    <script>
        // Session Check for Navbar
        const currentUser = localStorage.getItem('secure_nexus_logged_user');
        if (currentUser) {
            const navBtn = document.getElementById('nav-login-btn');
            navBtn.textContent = '🎮 Zum Game';
            navBtn.href = 'game.html';
        }

        const audio = document.getElementById('audio-stream');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');
        
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => { playIcon.textContent = '⏸'; playText.textContent = 'Pausieren'; });
            } else {
                audio.pause(); playIcon.textContent = '▶'; playText.textContent = 'Abspielen';
            }
        });
        document.getElementById('volume-slider').addEventListener('input', (e) => audio.volume = e.target.value);

        async function fetchRadio() {
            try {
                let r1 = await fetch('https://api.laut.fm/station/jackdarckart/current_song');
                if(r1.ok) { let d = await r1.json(); document.getElementById('track-title').textContent = `${d.artist?.name || 'jackdarckart'} – ${d.title || ''}`; }
                let r2 = await fetch('https://api.laut.fm/station/jackdarckart/listeners');
                if(r2.ok) document.getElementById('listener-count').textContent = await r2.json();
                let r3 = await fetch('https://api.laut.fm/station/jackdarckart/last_songs');
                if(r3.ok) {
                    let songs = await r3.json();
                    document.getElementById('last-songs-container').innerHTML = songs.slice(0, 3).map(s => `<div class="bg-[#030712] p-2 rounded-lg border border-slate-800">🎵 ${s.artist?.name} – ${s.title}</div>`).join('');
                }
            } catch(e){}
        }
        fetchRadio(); setInterval(fetchRadio, 15000);
    </script>
</body>
</html>
