<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jackdarckart | Webradio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#131b2e] border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-cyan-500/20 text-cyan-400 rounded-xl flex items-center justify-center font-bold text-lg">🎧</div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide">jackdarckart</h1>
                    <p class="text-[11px] text-slate-400">laut.fm/jackdarckart</p>
                </div>
            </div>
            <div class="flex items-center space-x-1.5 bg-red-500/10 border border-red-500/20 px-2.5 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                <span class="text-[10px] font-mono text-red-400 font-bold uppercase tracking-wider">LIVE</span>
            </div>
        </div>

        <!-- Aktueller Titel Anzeige -->
        <div class="bg-[#0b0f19] border border-slate-800/80 rounded-2xl p-4 text-center space-y-1">
            <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">Aktueller Titel</p>
            <div id="track-info" class="text-sm font-semibold text-cyan-300 truncate px-2">Verbindung wird aufgebaut...</div>
        </div>

        <!-- Player Controls -->
        <div class="space-y-4">
            <button id="play-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-2xl text-xs uppercase tracking-widest transition flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-cyan-500/20">
                <span id="play-icon" class="text-base">▶</span> 
                <span id="play-text">Stream Abspielen</span>
            </button>

            <div class="flex items-center justify-between bg-[#0b0f19] px-4 py-2.5 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400">Lautstärke</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" class="w-32 accent-cyan-500 cursor-pointer">
            </div>
        </div>

        <!-- Audio Element -->
        <audio id="audio-stream" preload="none">
            <source src="https://stream.laut.fm/jackdarckart" type="audio/mpeg">
        </audio>
    </div>

    <!-- Script für Stream & Song-Abruf -->
    <script>
        const audio = document.getElementById('audio-stream');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');
        const volumeSlider = document.getElementById('volume-slider');
        const trackInfo = document.getElementById('track-info');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.textContent = '⏸';
                    playText.textContent = 'Stream Pausieren';
                }).catch(err => {
                    alert('Stream konnte nicht gestartet werden.');
                });
            } else {
                audio.pause();
                playIcon.textContent = '▶';
                playText.textContent = 'Stream Abspielen';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        async function updateCurrentSong() {
            try {
                const res = await fetch('https://api.laut.fm/station/jackdarckart/current_song');
                if (res.ok) {
                    const data = await res.json();
                    const artist = data.artist?.name || 'jackdarckart';
                    const title = data.title || 'Live Stream';
                    trackInfo.textContent = `${artist} – ${title}`;
                }
            } catch (e) {
                trackInfo.textContent = 'jackdarckart Webradio';
            }
        }

        updateCurrentSong();
        setInterval(updateCurrentSong, 15000);
    </script>
</body>
</html>
