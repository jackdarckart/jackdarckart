<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack's Beat-Lab</title>
    <!-- Tailwind CSS für modernes Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-gray-800/80 backdrop-blur-md sticky top-0 z-50 bg-[#0b0f19]/90">
        <div class="flex items-center space-x-2">
            <span class="text-2xl p-2 bg-purple-600/20 rounded-xl">🎧</span>
            <span id="user-display" class="font-bold text-lg tracking-wide bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">jackdarckart</span>
        </div>
        <div class="flex space-x-1.5 sm:space-x-2">
            <button onclick="openModal('Garten')" class="bg-emerald-600/80 hover:bg-emerald-500 px-2.5 sm:px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-lg shadow-emerald-900/20 flex items-center gap-1">
                🌱 Garten
            </button>
            <button onclick="changeUsername()" class="bg-purple-600/80 hover:bg-purple-500 px-2.5 sm:px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-lg shadow-purple-900/20 flex items-center gap-1">
                👤 Profil
            </button>
            <button onclick="openAdmin()" class="bg-amber-600/80 hover:bg-amber-500 px-2.5 sm:px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-lg shadow-amber-900/20 flex items-center gap-1">
                🛠️ Admin
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 text-center mt-2">
        <h1 class="text-3xl font-black tracking-tight mb-1 text-white">Jack's Beat-Lab</h1>
        <p class="text-gray-400 text-xs sm:text-sm mb-6">Produziere Beats, erweitere dein Studio und verwalte deinen Fortschritt!</p>

        <!-- Big Action Button -->
        <button onclick="produceBeat()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:scale-95 text-white font-bold py-4 px-6 rounded-2xl shadow-xl shadow-purple-900/30 text-lg mb-8 transition transform flex items-center justify-center gap-2 border border-purple-400/20">
            <span>🎵</span> Beat produzieren <span class="text-xs bg-black/30 px-2 py-0.5 rounded-lg text-purple-200">+1</span>
        </button>

        <!-- Stats Grid -->
        <div class="space-y-4">
            <div class="bg-[#131b2e]/80 border border-gray-800/80 p-4 rounded-2xl shadow-lg backdrop-blur-sm">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-medium">Produzierte Beats</p>
                <p id="beats-count" class="text-3xl sm:text-4xl font-black text-purple-400">0</p>
            </div>

            <div class="bg-[#131b2e]/80 border border-gray-800/80 p-4 rounded-2xl shadow-lg backdrop-blur-sm">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-medium">Fans / Hörerschaft</p>
                <p id="fans-count" class="text-3xl sm:text-4xl font-black text-pink-400">0</p>
            </div>

            <div class="bg-[#131b2e]/80 border border-gray-800/80 p-4 rounded-2xl shadow-lg backdrop-blur-sm">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-medium">Beats pro Sekunde</p>
                <p id="bps-count" class="text-3xl sm:text-4xl font-black text-emerald-400">0.0</p>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="mt-8 flex justify-between items-center text-xs text-gray-500 px-2">
            <span id="save-status">💾 Automatisch gespeichert</span>
            <button onclick="resetGame()" class="text-red-400 hover:underline">Zurücksetzen</button>
        </div>
    </main>

    <!-- Admin Modal (Standardmäßig versteckt) -->
    <div id="admin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#131b2e] border border-amber-500/30 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-amber-400 flex items-center gap-2">🛠️ Admin-Steuerung</h3>
                <button onclick="closeAdmin()" class="text-gray-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Beats anpassen:</label>
                    <input type="number" id="admin-beats-input" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Fans anpassen:</label>
                    <input type="number" id="admin-fans-input" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Beats pro Sekunde (BPS):</label>
                    <input type="number" step="0.1" id="admin-bps-input" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="mt-6 flex space-x-2">
                <button onclick="applyAdminStats()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-900/20">
                    Änderungen speichern
                </button>
                <button onclick="closeAdmin()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2.5 rounded-xl text-sm transition">
                    Schließen
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let beats = parseFloat(localStorage.getItem('beat_lab_beats')) || 40430;
        let fans = parseInt(localStorage.getItem('beat_lab_fans')) || 14603;
        let bps = parseFloat(localStorage.getItem('beat_lab_bps')) || 161.0;
        let username = localStorage.getItem('beat_lab_user') || 'jackdarckart';

        document.getElementById('user-display').innerText = username;

        function produceBeat() {
            beats += 1;
            updateDisplay();
            saveGame();
        }

        function updateDisplay() {
            document.getElementById('beats-count').innerText = Math.floor(beats).toLocaleString('de-DE');
            document.getElementById('fans-count').innerText = Math.floor(fans).toLocaleString('de-DE');
            document.getElementById('bps-count').innerText = bps.toFixed(1);
        }

        function saveGame() {
            localStorage.setItem('beat_lab_beats', beats);
            localStorage.setItem('beat_lab_fans', fans);
            localStorage.setItem('beat_lab_bps', bps);
            localStorage.setItem('beat_lab_user', username);
        }

        function changeUsername() {
            let newName = prompt("Gib deinen Künstlernamen ein:", username);
            if (newName && newName.trim() !== "") {
                username = newName.trim();
                document.getElementById('user-display').innerText = username;
                saveGame();
            }
        }

        function openAdmin() {
            document.getElementById('admin-beats-input').value = Math.floor(beats);
            document.getElementById('admin-fans-input').value = fans;
            document.getElementById('admin-bps-input').value = bps.toFixed(1);
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function applyAdminStats() {
            beats = parseFloat(document.getElementById('admin-beats-input').value) || beats;
            fans = parseInt(document.getElementById('admin-fans-input').value) || fans;
            bps = parseFloat(document.getElementById('admin-bps-input').value) || bps;
            updateDisplay();
            saveGame();
            closeAdmin();
        }

        function openModal(section) {
            alert(section === 'Garten' ? '🌱 HD-Garten wird geladen...' : '💼 Lab-Steuerung wird geöffnet...');
        }

        function resetGame() {
            if (confirm("Möchtest du wirklich deinen gesamten Fortschritt zurücksetzen?")) {
                localStorage.clear();
                beats = 40430;
                fans = 14603;
                bps = 161.0;
                username = 'jackdarckart';
                document.getElementById('user-display').innerText = username;
                updateDisplay();
                saveGame();
            }
        }

        // Auto-production Loop
        setInterval(() => {
            beats += bps / 10;
            updateDisplay();
        }, 100);

        // Auto-save Loop
        setInterval(() => {
            saveGame();
        }, 5000);

        updateDisplay();
    </script>
</body>
</html>
