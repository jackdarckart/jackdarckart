<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jackdarckart | Quantum Cybernetic Audio Player v100.0</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init({ publicKey: "DEIN_EMAILJS_PUBLIC_KEY" });
        })();
    </script>
    <style>
        :root {
            --beat-val: 0;
            --bass-val: 0;
            --treble-val: 0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            background: #010206;
        }
        .glass-panel {
            background: linear-gradient(135deg, rgba(3, 10, 25, 0.96) 0%, rgba(1, 4, 10, 0.99) 100%);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(56, 189, 248, calc(0.3 + (var(--beat-val) * 0.7)));
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.98), 0 0 calc(20px + (var(--beat-val) * 80px)) rgba(56, 189, 248, calc(0.2 + (var(--bass-val) * 0.75))), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: border-color 0.06s ease, box-shadow 0.06s ease;
        }
        .cyber-button {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cyber-button:hover {
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.65);
            border-color: rgba(56, 189, 248, 0.95);
        }
        .cyber-button:active { transform: scale(0.97); }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.9)); }
            50% { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.6)); }
        }
        .neon-pulse { animation: pulse-glow 3s infinite ease-in-out; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 35px; }
        }
        .wave-bar { animation: wave 1.2s ease-in-out infinite; }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.6s; }
        .wave-bar:nth-child(5) { animation-delay: 0.8s; }

        #page-ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 50% 40%, rgba(14, 116, 144, calc(0.2 + (var(--bass-val) * 0.5))) 0%, rgba(1, 3, 10, 0.99) 85%);
            transform: scale(calc(1 + (var(--bass-val) * 0.09)));
            transition: transform 0.05s ease, background 0.05s ease;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(1, 2, 6, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#010206] text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-cyan-500 selection:text-white relative">

    <!-- Musik-synchroner Ambient-Hintergrund -->
    <div id="page-ambient-bg"></div>

    <!-- Header -->
    <header class="w-full border-b border-cyan-500/20 backdrop-blur-2xl sticky top-0 z-50 bg-[#010206]/95 px-4 sm:px-8 py-4 shadow-2xl">
        <div class="w-full max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 via-teal-600 to-pink-500 p-0.5 shadow-lg shadow-cyan-500/25 neon-pulse">
                    <div class="w-full h-full bg-[#010206] rounded-[10px] flex items-center justify-center text-base">🎧</div>
                </div>
                <div>
                    <span class="font-black text-xs tracking-widest uppercase bg-gradient-to-r from-cyan-400 via-teal-300 to-pink-400 bg-clip-text text-transparent block">jackdarckart Player</span>
                    <span class="text-[9px] font-mono text-slate-400 tracking-wider">Quantum Cybernetic v100.0</span>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-[#010206] px-4 py-1.5 rounded-xl border border-cyan-500/20 shadow-inner">
                <span class="text-[9px] font-mono text-cyan-400 mr-1 tracking-widest">LIVE STREAM</span>
                <div class="w-1 bg-cyan-500 rounded-full wave-bar"></div>
                <div class="w-1 bg-teal-500 rounded-full wave-bar"></div>
                <div class="w-1 bg-pink-500 rounded-full wave-bar"></div>
                <div class="w-1 bg-cyan-500 rounded-full wave-bar"></div>
            </div>
        </div>
    </header>

    <!-- Main Player Deck -->
    <main class="w-full flex-grow p-4 sm:p-8 flex items-center justify-center relative z-10 my-auto">
        <div class="w-full max-w-2xl mx-auto">
            <div class="glass-panel p-6 sm:p-8 rounded-[2.5rem] relative overflow-hidden shadow-2xl space-y-6">
                
                <!-- Dekorative Hintergrund-Glows -->
                <div class="absolute -top-20 -right-20 w-60 h-60 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-20 -left-20 w-60 h-60 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Live Track Info Header -->
                <div class="text-center space-y-1 relative z-10">
                    <span class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest font-bold">stream-musik.space WebRadio</span>
                    <h2 id="radio-track-title" class="text-base sm:text-xl font-bold text-white font-mono tracking-wide truncate px-4">Verbindung wird aufgebaut...</h2>
                </div>

                <!-- LIVE 3D VISUALIZER CANVAS (Der lebendige Kern des Players) -->
                <div id="canvas-container" class="relative w-full h-[320px] sm:h-[380px] rounded-3xl border border-cyan-500/40 overflow-hidden shadow-inner bg-[#010307]">
                    <canvas id="player-canvas" class="w-full h-full block cursor-pointer"></canvas>
                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                        <span class="text-[10px] font-mono text-cyan-400/40 uppercase tracking-widest">Quantum Audio Matrix</span>
                    </div>
                </div>

                <!-- Player Controls & Volume -->
                <div class="space-y-4 relative z-10">
                    <div class="flex items-center justify-between gap-4">
                        <button type="button" id="player-play-btn" class="cyber-button flex-grow bg-gradient-to-r from-cyan-600 via-teal-600 to-pink-500 text-white font-black py-4 px-6 rounded-2xl text-sm uppercase tracking-widest cursor-pointer shadow-xl shadow-cyan-500/40 flex items-center justify-center gap-3">
                            <span id="play-icon" class="text-lg">▶</span> <span id="play-text">Stream Abspielen</span>
                        </button>
                    </div>

                    <div class="flex items-center justify-between bg-[#010206]/80 px-5 py-3 rounded-2xl border border-cyan-500/20 shadow-inner">
                        <div class="flex items-center gap-2 text-xs font-mono text-slate-300">
                            <span>🔊</span> <span>Lautstärke</span>
                        </div>
                        <input type="range" id="player-volume" min="0" max="1" step="0.05" value="0.8" class="w-36 sm:w-48 accent-cyan-500 cursor-pointer">
                    </div>
                </div>

                <!-- Hidden Audio Element -->
                <audio id="radio-audio" crossorigin="anonymous" preload="auto">
                    <source src="https://stream.laut.fm/jackdarckart" type="audio/mpeg">
                    <source src="https://jackdarckart.stream.laut.fm/jackdarckart" type="audio/mpeg">
                </audio>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-cyan-500/20 py-3 px-4 bg-[#010206] text-center relative z-10">
        <div class="w-full max-w-5xl mx-auto flex justify-between items-center text-[11px] font-mono text-slate-400">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span> Echtzeit Audio-Sync Aktiv</span>
            <span class="text-cyan-400/90 font-bold tracking-wider">jackdarckart • Prime Elite Nexus</span>
        </div>
    </footer>

    <!-- PLAYER & VISUALIZER ENGINE SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let audioCtx = null;
            let analyser = null;
            let sourceNode = null;

            const audio = document.getElementById('radio-audio');
            const playBtn = document.getElementById('player-play-btn');
            const playIcon = document.getElementById('play-icon');
            const playText = document.getElementById('play-text');
            const volumeSlider = document.getElementById('player-volume');
            const canvas = document.getElementById('player-canvas');
            const container = document.getElementById('canvas-container');

            if (!canvas || !container) return;
            const ctx = canvas.getContext('2d');

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
            } catch (e) {}

            const bufferLength = analyser ? analyser.frequencyBinCount : 128;
            const dataArray = new Uint8Array(bufferLength);
            let smoothBeat = 0;
            let smoothBass = 0;

            // 3D Kugelpunkte (Icosaeder für die Cybernetic Sphere im Player)
            const phi = (1 + Math.sqrt(5)) / 2;
            let rawVertices = [
                [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
                [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
                [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]
            ];
            let baseSpherePoints = rawVertices.map(v => {
                let len = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
                return [v[0]/len, v[1]/len, v[2]/len];
            });

            // Explodierende Neon-Fragmente & Shards im Takt
            let shards = [];
            for(let i=0; i<100; i++) {
                let theta = Math.random() * Math.PI * 2;
                let costheta = Math.random() * 2 - 1;
                let u = Math.random();
                let r = 80 + u * 160;
                shards.push({
                    x: Math.cos(theta) * r,
                    y: costheta * r,
                    z: (Math.random() - 0.5) * 140,
                    size: Math.random() * 12 + 4,
                    color: Math.random() > 0.5 ? '#38bdf8' : '#ec4899',
                    angle: Math.random() * Math.PI
                });
            }

            let rotX = 0;
            let rotY = 0;

            function renderLoop() {
                requestAnimationFrame(renderLoop);

                const dpr = window.devicePixelRatio || 1;
                const displayWidth = container.clientWidth;
                const displayHeight = container.clientHeight;

                if (canvas.width !== displayWidth * dpr || canvas.height !== displayHeight * dpr) {
                    canvas.width = displayWidth * dpr;
                    canvas.height = displayHeight * dpr;
                    canvas.style.width = displayWidth + 'px';
                    canvas.style.height = displayHeight + 'px';
                }

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                let isPlaying = audio && !audio.paused;
                let beatVal = 0;
                let bassVal = 0;

                if (analyser && isPlaying) {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    let bassSum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                        if (i < 10) bassSum += dataArray[i];
                    }
                    beatVal = (sum / bufferLength) / 255;
                    bassVal = (bassSum / 10) / 255;
                } else if (isPlaying) {
                    let time = Date.now() / 1000;
                    beatVal = (Math.sin(time * Math.PI * 3) + 1) * 0.45;
                    bassVal = (Math.sin(time * Math.PI * 1.5) + 1) * 0.55;
                } else {
                    let time = Date.now() / 1000;
                    beatVal = (Math.sin(time * 1.5) + 1) * 0.05;
                    bassVal = 0.05;
                }

                smoothBeat += (beatVal - smoothBeat) * 0.22;
                smoothBass += (bassVal - smoothBass) * 0.22;

                document.documentElement.style.setProperty('--beat-val', smoothBeat.toFixed(3));
                document.documentElement.style.setProperty('--bass-val', smoothBass.toFixed(3));

                const w = displayWidth;
                const h = displayHeight;
                const s = Math.min(w, h) / 750;

                // Deep Space Ambient im Player-Canvas
                let bgGrad = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, Math.max(w, h) * 0.7);
                bgGrad.addColorStop(0, `rgba(14, 116, 144, ${0.35 + smoothBass * 0.45})`);
                bgGrad.addColorStop(0.5, '#010610');
                bgGrad.addColorStop(1, '#000103');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                rotX += 0.008 + (smoothBass * 0.02);
                rotY += 0.012 + (smoothBass * 0.025);

                let centerX = w / 2;
                let centerY = h / 2;
                let sphereRadius = (100 + smoothBass * 55) * s;

                // Bass Schockwellen
                if (smoothBass > 0.25) {
                    ctx.strokeStyle = `rgba(56, 189, 248, ${smoothBass * 0.65})`;
                    ctx.lineWidth = 2.5 * s;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, (sphereRadius + smoothBass * 160), 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.strokeStyle = `rgba(236, 72, 153, ${smoothBass * 0.5})`;
                    ctx.lineWidth = 1.5 * s;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, (sphereRadius + smoothBass * 220), 0, Math.PI * 2);
                    ctx.stroke();
                }

                // 3D Wireframe Sphere Projektion (Zentriert im Player)
                let projectedPoints = baseSpherePoints.map(pt => {
                    let x = pt[0];
                    let y = pt[1];
                    let z = pt[2];

                    let x1 = x * Math.cos(rotY) + z * Math.sin(rotY);
                    let z1 = -x * Math.sin(rotY) + z * Math.cos(rotY);
                    let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
                    let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);

                    let distance = 3.5;
                    let fov = 350 * s;
                    let alpha = fov / (distance + z2);

                    return {
                        x: centerX + x1 * sphereRadius * alpha,
                        y: centerY + y2 * sphereRadius * alpha,
                        z: z2
                    };
                });

                // Wireframe Kanten
                for (let i = 0; i < projectedPoints.length; i++) {
                    for (let j = i + 1; j < projectedPoints.length; j++) {
                        let p1 = projectedPoints[i];
                        let p2 = projectedPoints[j];
                        let dist3D = Math.sqrt(Math.pow(baseSpherePoints[i][0]-baseSpherePoints[j][0], 2) + Math.pow(baseSpherePoints[i][1]-baseSpherePoints[j][1], 2) + Math.pow(baseSpherePoints[i][2]-baseSpherePoints[j][2], 2));
                        
                        if (dist3D < 1.3) {
                            ctx.strokeStyle = (i % 2 === 0) ? `rgba(56, 189, 248, ${0.55 + smoothBeat * 0.45})` : `rgba(236, 72, 153, ${0.55 + smoothBass * 0.45})`;
                            ctx.lineWidth = 1.8 * s;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }

                // Explodierende Neon-Fragmente um die Player-Sphere
                shards.forEach(sh => {
                    sh.angle += 0.028 * (1 + smoothBass);
                    let currentR = (120 + smoothBass * 90) + Math.sin(sh.angle) * 30;
                    let sx = centerX + Math.cos(sh.angle + rotY) * currentR;
                    let sy = centerY + Math.sin(sh.angle * 1.5 + rotX) * currentR * 0.8;

                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(sh.angle);

                    ctx.strokeStyle = sh.color;
                    ctx.lineWidth = 2 * s;
                    ctx.fillStyle = sh.color === '#38bdf8' ? 'rgba(56, 189, 248, 0.35)' : 'rgba(236, 72, 153, 0.35)';
                    
                    ctx.beginPath();
                    ctx.moveTo(0, -sh.size * (1 + smoothBeat));
                    ctx.lineTo(sh.size * (1 + smoothBeat), sh.size * (1 + smoothBeat));
                    ctx.lineTo(-sh.size * (1 + smoothBeat), sh.size * (1 + smoothBeat));
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });
            }

            renderLoop();

            // Play / Pause Steuerung
            playBtn.addEventListener('click', function() {
                if (audio.paused) {
                    audio.play().then(() => {
                        playIcon.textContent = '⏸';
                        playText.textContent = 'Stream Pausieren';
                        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    }).catch(err => alert("⚠️ Stream konnte nicht gestartet werden."));
                } else {
                    audio.pause();
                    playIcon.textContent = '▶';
                    playText.textContent = 'Stream Abspielen';
                }
            });

            // Lautstärke Steuerung
            volumeSlider.addEventListener('input', function(e) {
                audio.volume = e.target.value;
            });

            // Live Song Titel Abruf von laut.fm
            async function fetchCurrentSong() {
                try {
                    const response = await fetch('https://api.laut.fm/station/jackdarckart/current_song');
                    if (response.ok) {
                        const data = await response.json();
                        const artist = data.artist?.name || 'jackdarckart';
                        const title = data.title || 'Live Stream';
                        const displayEl = document.getElementById('radio-track-title');
                        if (displayEl) displayEl.textContent = `${artist} – ${title}`;
                    }
                } catch(e) {
                    const displayEl = document.getElementById('radio-track-title');
                    if (displayEl) displayEl.textContent = 'jackdarckart • stream-musik.space Live Stream';
                }
            }

            fetchCurrentSong();
            setInterval(fetchCurrentSong, 15000);
        });
    </script>
</body>
</html>
