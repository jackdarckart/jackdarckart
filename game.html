<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jackdarckart | Cyber Beat Empire &amp; Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010309; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glass-panel { background: linear-gradient(135deg, rgba(13, 22, 42, 0.88) 0%, rgba(5, 10, 22, 0.96) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(56, 189, 248, 0.2); }
        .cyber-button:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); border-color: rgba(56, 189, 248, 0.8); }
        .score-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
        .score-container .score { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; color: #f8fafc; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); padding: 1rem; border-radius: 1rem; box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); }
        .score-container .score:hover { background-color: rgba(0, 0, 0, 0.8); }
        .click-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; color: #f8fafc; font-weight: bold; background-color: rgba(56, 189, 248, 0.8); padding: 1rem; border-radius: 1rem; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .click-button:hover { background-color: rgba(56, 189, 248, 0.9); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(1, 3, 9, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <!-- Header / Nav -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center border-b border-cyan-500/20 pb-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-pink-500 p-0.5 flex items-center justify-center font-bold">🎮</div>
            <div>
                <span class="font-black text-xs tracking-widest uppercase bg-gradient-to-r from-cyan-400 to-pink-400 bg-clip-text text-transparent block">Cyber Beat Empire (Extended Hard Mode)</span>
                <span id="user-badge" class="text-[10px] font-mono text-emerald-400">--</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="index.html" class="cyber-button bg-slate-900 text-slate-300 border border-slate-800 px-3 py-2 rounded-xl text-xs font-mono">🎧 Webradio</a>
            <button type="button" id="btn-logout" class="cyber-button bg-red-600/20 text-red-300 border border-red-500/30 px-3 py-2 rounded-xl text-xs font-mono">🚪 Abmelden</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full space-y-6 my-auto py-4">
        
        <!-- Game Stats & Clicker -->
        <div class="glass-panel p-6 sm:p-8 rounded-[2.5rem] space-y-6">
            <div class="score-container">
                <div class="score" id="g-beats">0</div>
            </div>
            <button type="button" id="btn-click" class="click-button w-full bg-gradient-to-r from-cyan-600 via-teal-600 to-pink-600 text-white font-black py-5 rounded-2xl text-sm uppercase tracking-widest cursor-pointer shadow-xl">
                ⚡ Neuen Beat Produzieren (+1 Beat)
            </button>

            <div class="space-y-3">
                <h3 class="text-xs font-mono text-cyan-400 font-bold uppercase">🛠️ Erweiterter Upgrades Shop</h3>
                <div id="shop" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[360px] overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- Cloud Backup & Security Panel -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <h3 class="text-xs font-mono text-teal-300 font-bold uppercase">☁️ Cloud Backup</h3>
                <div class="flex gap-2">
                    <button type="button" id="btn-export" class="cyber-button bg-cyan-600 text-white text-xs font-mono font-bold py-2.5 px-4 rounded-xl cursor-pointer w-full">📥 Exportieren</button>
                    <label class="cyber-button bg-teal-600 text-white text-xs font-mono font-bold py-2.5 px-4 rounded-xl cursor-pointer w-full text-center">📤 Importieren<input type="file" id="input-import" accept=".json" class="hidden"></label>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <h3 class="text-xs font-mono text-amber-400 font-bold uppercase">🛠️ Account Sicherheit</h3>
                <div class="space-y-2">
                    <input type="password" id="new-pin" maxlength="6" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3 py-2 text-white text-xs outline-none" placeholder="Neue PIN (min. 4 Ziffern)">
                    <button type="button" id="btn-changepin" class="cyber-button w-full bg-slate-900 text-cyan-300 border border-cyan-500/30 py-2 rounded-xl text-xs font-mono">🔑 PIN Ändern</button>
                    <button type="button" id="btn-resetgame" class="cyber-button w-full bg-amber-600/20 text-amber-300 border border-amber-500/30 py-2 rounded-xl text-xs font-mono">🔄 Nur Spielstand Reseten</button>
                    <button type="button" id="btn-deleteacc" class="cyber-button w-full bg-red-600/20 text-red-300 border border-red-500/30 py-2 rounded-xl text-xs font-mono">⚠️ Account Löschen</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const user = localStorage.getItem('secure_nexus_logged_user');
        if (!user) { window.location.href = 'login.html'; }
        document.getElementById('user-badge').textContent = user;

        function getDB() { return JSON.parse(localStorage.getItem('secure_nexus_master_users_db_v4')) || {}; }
        function saveDB(db) { localStorage.setItem('secure_nexus_master_users_db_v4', JSON.stringify(db)); }

        let db = getDB();
        if (!db[user]) { window.location.href = 'login.html'; }
        let gData = db[user].gameData;
        if (!gData.upgrades) gData.upgrades = {};

        // Comprehensive & Harder Upgrades List (Music & Crypto/Hash themed)
        const upgrades = [
            { id: 'mic', name: 'Pro Mikrofon', cost: 40, mult: 1.65, beat: 1, desc: '+1 Beat/s' },
            { id: 'midi', name: 'MIDI Keyboard', cost: 180, mult: 1.70, beat: 3, desc: '+3 Beats/s' },
            { id: 'studio', name: 'Sound Isolation Studio', cost: 650, mult: 1.75, beat: 10, desc: '+10 Beats/s' },
            { id: 'synth', name: 'Analog Modular Synth', cost: 2400, mult: 1.80, beat: 35, desc: '+35 Beats/s' },
            { id: 'producer', name: 'Ghost Producer', cost: 9500, mult: 1.85, beat: 120, desc: '+120 Beats/s' },
            { id: 'mastering', name: 'AI Mastering Suite', cost: 38000, mult: 1.90, beat: 450, desc: '+450 Beats/s' },
            { id: 'rig', name: 'Crypto Hash Rig', cost: 120000, mult: 1.95, fan: 4, desc: '+4 Fans/s' },
            { id: 'gomining', name: 'Liquid Hash Node', cost: 450000, mult: 2.00, fan: 18, desc: '+18 Fans/s' },
            { id: 'staking', name: 'Staking Reward Protocol', cost: 1800000, mult: 2.05, beat: 2200, desc: '+2200 Beats/s' },
            { id: 'quantum', name: 'Quantum Beat Syndicate', cost: 8000000, mult: 2.15, beat: 10000, fan: 50, desc: '+10K Beats/s & +50 Fans/s' }
        ];

        function getCost(u, lvl) { return Math.floor(u.cost * Math.pow(u.mult, lvl)); }

        function updateUI() {
            document.getElementById('g-beats').textContent = Math.floor(gData.beats).toLocaleString();
            document.getElementById('g-fans').textContent = Math.floor(gData.fans).toLocaleString();
            document.getElementById('g-releases').textContent = gData.releases.toLocaleString();
            
            let hash = 0;
            upgrades.forEach(u => { if(u.fan) hash += (gData.upgrades[u.id] || 0) * u.fan; });
            document.getElementById('g-hash').textContent = `${hash} H/s`;

            let shop = document.getElementById('shop');
            shop.innerHTML = '';
            upgrades.forEach(u => {
                let lvl = gData.upgrades[u.id] || 0;
                let cost = getCost(u, lvl);
                let can = gData.beats >= cost;
                shop.innerHTML += `
                    <div class="bg-[#030712] p-3 rounded-xl border ${can ? 'border-cyan-500/40':'border-slate-800'} flex justify-between items-center text-xs font-mono">
                        <div><b>${u.name}</b> (Lvl ${lvl})<br><span class="text-slate-400">${u.desc}</span></div>
                        <button onclick="buy('${u.id}')" class="cyber-button bg-cyan-600 text-white px-3 py-1.5 rounded-lg uppercase ${!can?'opacity-45':''}">⚡ ${cost.toLocaleString()}</button>
                    </div>`;
            });
            db[user].gameData = gData;
            saveDB(db);
        }

        window.buy = function(id) {
            let u = upgrades.find(x => x.id === id);
            let lvl = gData.upgrades[id] || 0;
            let cost = getCost(u, lvl);
            if (gData.beats >= cost) {
                gData.beats -= cost;
                gData.upgrades[id] = lvl + 1;
                updateUI();
            }
        };

        document.getElementById('btn-click').onclick = () => { gData.beats += 1; updateUI(); };

        setInterval(() => {
            let bInc = 0, fInc = 0;
            upgrades.forEach(u => {
                let lvl = gData.upgrades[u.id] || 0;
                if(u.beat) bInc += lvl * u.beat;
                if(u.fan) fInc += lvl * u.fan;
            });
            if(bInc > 0 || fInc > 0) {
                gData.beats += bInc; gData.fans += fInc;
                if(gData.beats >= (gData.releases + 1) * 5000) {
                    gData.releases++;
                }
                updateUI();
            }
        }, 1000);

        document.getElementById('btn-logout').onclick = () => { localStorage.removeItem('secure_nexus_logged_user'); window.location.href = 'index.html'; };
        document.getElementById('btn-changepin').onclick = () => {
            let pin = document.getElementById('new-pin').value.trim();
            if(pin.length < 4) return alert('PIN muss min. 4 Ziffern haben!');
            db[user].pin = pin; saveDB(db); alert('✅ PIN erfolgreich geändert!'); document.getElementById('new-pin').value = '';
        };
        document.getElementById('btn-resetgame').onclick = () => {
            if(confirm('Spielstand wirklich auf 0 zurücksetzen?')) {
                gData = { beats: 0, fans: 0, releases: 0, upgrades: {} };
                updateUI(); alert('✅ Spielstand zurückgesetzt!');
            }
        };
        document.getElementById('btn-deleteacc').onclick = () => {
            if(confirm('Account unwiderruflich löschen?')) {
                delete db[user]; saveDB(db); localStorage.removeItem('secure_nexus_logged_user'); window.location.href = 'index.html';
            }
        };

        // Cloud Backup
        document.getElementById('btn-export').onclick = () => {
            let blob = new Blob([JSON.stringify({ user, gameData: gData }, null, 2)], { type: 'application/json' });
            let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup_${user}.json`; a.click();
        };
        document.getElementById('input-import').onchange = (e) => {
            let file = e.target.files[0]; if(!file) return;
            let r = new FileReader();
            r.onload = (ev) => {
                try {
                    let d = JSON.parse(ev.target.result);
                    if(d.gameData) { gData = d.gameData; updateUI(); alert('✅ Backup geladen!'); }
                } catch(err) { alert('❌ Fehlerhafte Datei.'); }
            };
            r.readAsText(file);
        };

        updateUI();
    </script>
</body>
</html>
