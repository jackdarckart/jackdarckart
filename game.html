<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kleines Punktespiel von jackdarckart.">
  <title>Quantum Generator · jackdarckart</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--accent:#00ffcc;--violet:#b553e6;--muted:#b5b5bd}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.5rem;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#24242e,var(--bg) 62%)}main{width:min(100%,27rem);padding:clamp(1.5rem,5vw,3rem);border:2px solid var(--accent);border-radius:1rem;background:rgb(15 15 18/.88);box-shadow:0 0 2rem rgb(0 255 204/.16);text-align:center}.back{position:fixed;top:1rem;left:1rem;color:var(--muted)}.eyebrow{margin:0;color:var(--accent);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}h1{margin:1rem 0;color:#fff}.score{margin:1.5rem 0;font:900 clamp(4rem,20vw,6rem)/1 ui-monospace,SFMono-Regular,monospace;color:var(--violet);text-shadow:0 0 1.5rem rgb(181 83 230/.7)}button{width:100%;min-height:3.25rem;border:2px solid var(--accent);border-radius:.5rem;background:transparent;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}button:hover,button:focus-visible{background:var(--accent);color:var(--bg)}:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <a class="back" href="index.html">← Zur Startseite</a>
  <main>
    <p class="eyebrow">Data stream active</p>
    <h1>Quantum Generator</h1>
    <output id="score" class="score" aria-live="polite">0</output>
    <button id="gather" type="button">Punkt sammeln</button>
  </main>
  <script>
    if(sessionStorage.getItem('jackdarckartDemoAccess')!=='true')window.location.replace('login.html');
    let points=0;const score=document.querySelector('#score');document.querySelector('#gather').addEventListener('click',()=>{points+=1;score.value=String(points);score.textContent=String(points)});
  </script>
</body>
</html>
