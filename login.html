<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demo-Zugang zum jackdarckart-Mitgliederbereich.">
  <title>Mitgliederbereich · jackdarckart</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--accent:#00ffcc;--violet:#b553e6;--muted:#b5b5bd;--danger:#ff7b8d}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.5rem;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#24242e,var(--bg) 62%)}main{width:min(100%,25rem);padding:2rem;border:1px solid var(--violet);border-radius:1rem;background:rgb(26 26 30/.8);box-shadow:0 0 2rem rgb(181 83 230/.2)}a{color:var(--accent)}h1{margin-top:1.5rem}p{line-height:1.55;color:var(--muted)}label{display:block;margin:1.25rem 0 .45rem;font-weight:700}input{width:100%;min-height:3rem;padding:.75rem;border:1px solid rgb(181 83 230/.7);border-radius:.5rem;background:#0d0d0f;color:#fff;font:inherit}button{width:100%;min-height:3rem;margin-top:1.5rem;border:0;border-radius:.5rem;background:linear-gradient(135deg,var(--violet),#7928ca);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover,button:focus-visible{filter:brightness(1.15)}#message{min-height:1.5em;margin:.85rem 0 0}.error{color:var(--danger)}:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Zur Startseite</a>
    <h1>Mitgliederbereich</h1>
    <p>Dies ist eine Demo ohne echte Benutzerkonten. Es werden keine Passwörter gespeichert oder übertragen.</p>
    <form id="accessForm" novalidate>
      <label for="email">E-Mail-Adresse</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="message">
      <button type="submit">Demo starten</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form=document.querySelector('#accessForm');const email=document.querySelector('#email');const message=document.querySelector('#message');
    form.addEventListener('submit',(event)=>{event.preventDefault();if(!email.validity.valid){message.textContent='Bitte gib eine gültige E-Mail-Adresse ein.';message.className='error';email.focus();return}sessionStorage.setItem('jackdarckartDemoAccess','true');window.location.assign('game.html')});
  </script>
</body>
</html>
