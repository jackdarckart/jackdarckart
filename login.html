<html lang="de"><body style="background:radial-gradient(circle at center, #16161a 0%, #09090b 100%);color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;position:relative;"><a href="index.html" style="position:absolute;top:20px;left:20px;color:#8a8a93;text-decoration:none;font-size:0.9rem;text-transform:uppercase;letter-spacing:1px;border:1px solid rgba(138,138,147,0.3);padding:8px 15px;border-radius:4px;transition:all 0.3s;">? Zurück</a><div style="background:rgba(26,26,30,0.75);padding:40px;border-radius:12px;border:1px solid #b553e6;box-shadow:0 0 30px rgba(181,83,230,0.25);width:320px;text-align:center;"><h2 id="title" style="text-transform:uppercase;letter-spacing:2px;margin-bottom:30px;">Core Login</h2><label style="font-size:0.8rem;color:#8a8a93;text-transform:uppercase;display:block;text-align:left;">E-Mail Adresse</label><input type="email" id="email" style="background:#0d0d0f;border:1px solid rgba(181,83,230,0.4);color:#fff;padding:12px;width:100%;border-radius:6px;margin:8px 0 24px 0;font-size:1rem;"><label style="font-size:0.8rem;color:#8a8a93;text-transform:uppercase;display:block;text-align:left;">Sicherheits-PIN</label><input type="password" id="pin" maxlength="6" style="background:#0d0d0f;border:1px solid rgba(181,83,230,0.4);color:#fff;padding:12px;width:100%;border-radius:6px;margin:8px 0 24px 0;font-size:1rem;text-align:center;letter-spacing:5px;"><button id="actionBtn" style="background:linear-gradient(135deg,#b553e6 0%,#7928ca 100%);color:white;border:none;padding:14px;width:100%;font-size:1rem;font-weight:bold;text-transform:uppercase;border-radius:6px;cursor:pointer;box-shadow:0 0 15px rgba(181,83,230,0.3);">Verbinden</button><p id="toggleText" style="margin-top:20px;font-size:0.85rem;color:#a0a0a5;cursor:pointer;text-decoration:underline;">Noch kein Konto? Registrieren</p><div id="msg" style="font-weight:bold;margin-top:15px;display:none;letter-spacing:1px;"></div></div><script>let isLogin=true;const title=document.getElementById("title"),actionBtn=document.getElementById("actionBtn"),toggleText=document.getElementById("toggleText"),msg=document.getElementById("msg");toggleText.addEventListener("click",()=>{isLogin=!isLogin;title.innerText=isLogin?"Core Login":"Registrierung";actionBtn.innerText=isLogin?"Verbinden":"Konto Erstellen";toggleText.innerText=isLogin?"Noch kein Konto? Registrieren":"Bereits registriert? Login";msg.style.display="none"});actionBtn.addEventListener("click",()=>{const em=document.getElementById("email").value,pi=document.getElementById("pin").value;if(!em||!pi){msg.style.color="#ff3366";msg.innerText="?? FELDER AUSFÜLLEN";msg.style.display="block";return}if(isLogin){const storedPin=localStorage.getItem(em);if(storedPin&&storedPin===pi||em==="admin@space.de"&&pi==="1234"){msg.style.display="none";window.location.href="game.html"}else{msg.style.color="#ff3366";msg.innerText="?? ZUGRIFF VERWEIGERT";msg.style.display="block"}}else{localStorage.setItem(em,pi);msg.style.color="#00ffcc";msg.innerText="? REGISTRIERUNG ERFOLGREICH!";msg.style.display="block";setTimeout(()=>{isLogin=true;title.innerText="Core Login";actionBtn.innerText="Verbinden";toggleText.innerText="Noch kein Konto? Registrieren"},1500)}});</script></body></html>
