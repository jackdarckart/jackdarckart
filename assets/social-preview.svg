  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="470" rx="40" fill="#0d1727" stroke="#4ddcff" stroke-opacity="0.35"/>
  <circle cx="170" cy="170" r="28" fill="#ff6b7d"/>
